name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m sql_lens --help
      - run: python -m sql_lens lint examples/sales_report.sql || true
      - run: python -m sql_lens plan examples/explain_orders.json
      - run: python -m sql_lens format --check examples/reference_formatted.sql
